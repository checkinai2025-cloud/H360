<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <meta name="description" content="Acesse a Check-in IA: contato, quem somos e programa de parceiros.">
  <title>Check-in IA | Acesse nossos canais</title>
  <link rel="icon" href="assets/checkin-ia-identity.png" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --brand: #343ab8;
      --accent: #7771ed;
      --lavender: #f1efff;
      --deep: #0a173a;
      --gold: #d9b68a;
      --white: #fff;
      --line: #dbe1f0;
      font-family: Poppins, Arial, sans-serif;
      color: var(--deep);
      background: var(--white);
    }

    * { box-sizing: border-box; }
    html { min-width: 320px; }
    body { margin: 0; min-height: 100svh; }
    body::before, body::after { content: ""; position: fixed; z-index: 0; width: min(42vw, 520px); height: min(30vw, 340px); pointer-events: none; background: linear-gradient(135deg, #e9e6ff, rgba(255, 255, 255, 0)); clip-path: polygon(0 0, 100% 0, 0 100%); }
    body::before { top: 0; left: 0; }
    body::after { right: 0; bottom: 0; transform: rotate(180deg); }
    a { color: inherit; text-decoration: none; }
    img { display: block; max-width: 100%; }
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; }

    .identity-window { position: relative; width: 100%; aspect-ratio: 2.85; overflow: hidden; }
    .identity-window img { position: absolute; top: 64%; left: -12.5%; width: 125%; max-width: none; height: auto; transform: translateY(-50%); }

    .intro {
      position: fixed;
      inset: 0;
      z-index: 20;
      display: grid;
      place-items: center;
      background: var(--white);
      animation: intro-exit 700ms cubic-bezier(.2, .8, .2, 1) 1450ms forwards;
    }
    .intro-inner { width: min(82vw, 620px); }
    .intro .identity-window { opacity: 0; animation: identity-enter 700ms cubic-bezier(.2, .8, .2, 1) 100ms forwards; }
    .intro-line { display: block; width: 0; height: 2px; margin: 14px auto 0; background: var(--gold); animation: line-grow 650ms ease 440ms forwards; }

    .page {
      position: relative;
      z-index: 1;
      width: min(100% - 32px, 510px);
      min-height: 100svh;
      margin: 0 auto;
      padding: 30px 0 24px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      animation: page-enter 650ms ease 1550ms both;
    }

    .brand { text-align: center; }
    .brand-rule { width: 48px; height: 2px; margin: 8px auto 14px; background: var(--gold); }
    .brand-mantra { max-width: 360px; margin: 0 auto; color: var(--deep); font-size: 12px; font-weight: 400; line-height: 1.45; }

    .destinations { display: grid; gap: 11px; margin-top: 28px; }
    .destination {
      min-height: 84px;
      padding: 16px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--white);
      box-shadow: 0 6px 18px rgba(10, 23, 58, .05);
      transition: transform 180ms ease, box-shadow 180ms ease, border-color 180ms ease;
      cursor: pointer;
    }
    .destination:hover { transform: translateY(-2px); border-color: var(--accent); box-shadow: 0 12px 24px rgba(10, 23, 58, .12); }
    .destination:active { transform: translateY(0); }
    .destination:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
    .destination-copy { min-width: 0; }
    .destination-title { display: block; font-size: 16px; font-weight: 700; line-height: 1.3; }
    .destination-detail { display: block; margin-top: 3px; color: #53607f; font-size: 12px; line-height: 1.35; }
    .destination-icon { width: 38px; height: 38px; flex: none; display: grid; place-items: center; border-radius: 8px; background: #efefff; color: var(--brand); transition: transform 180ms ease; }
    .destination-icon svg { display: block; width: 26px; height: 26px; }
    .destination:hover .destination-icon { transform: scale(1.07); }
    .destination--primary { color: var(--white); border-color: var(--deep); background: var(--deep); }
    .destination--primary { border-left: 3px solid var(--gold); }
    .destination--primary .destination-detail { color: #dbe1fc; }
    .destination--primary .destination-icon { background: rgba(255, 255, 255, .13); color: var(--white); }
    .destination--primary:hover { border-color: var(--deep); box-shadow: 0 12px 24px rgba(10, 23, 58, .2); }
    .destination--partner { border-color: #c2c0f6; background: #f4f3ff; }
    .destination--partner .destination-detail { color: var(--brand); }

    .hospitality-image { margin: 22px 0 0; overflow: hidden; border: 1px solid var(--gold); border-radius: 8px; box-shadow: 0 18px 38px rgba(10, 23, 58, .1); }
    .hospitality-image img { width: 100%; height: 185px; object-fit: cover; object-position: center; }

    @keyframes identity-enter { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes line-grow { to { width: 64px; } }
    @keyframes intro-exit { to { opacity: 0; visibility: hidden; pointer-events: none; transform: translateY(-12px); } }
    @keyframes page-enter { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

    @media (min-width: 900px) and (min-height: 800px) {
      .page { padding-top: 40px; padding-bottom: 36px; }
      .hospitality-image img { height: 205px; }
    }

    @media (max-width: 390px) {
      .page { padding-top: 20px; }
      .destinations { margin-top: 22px; }
      .destination { min-height: 80px; padding: 13px 15px; }
      .destination-title { font-size: 15px; }
    }

    @media (max-width: 360px) {
      .hospitality-image img { height: 158px; }
    }

    @media (prefers-reduced-motion: reduce) {
      .intro { display: none; }
      .page, .destination, .destination-icon { animation: none; transition: none; }
    }
  </style>
</head>
<body>
  <div class="intro" aria-hidden="true">
    <div class="intro-inner">
      <div class="identity-window"><img src="assets/checkin-ia-identity.png" width="1559" height="1009" alt=""></div>
      <span class="intro-line"></span>
    </div>
  </div>
  <main class="page">
    <header class="brand">
      <h1 class="sr-only">Check-in IA</h1>
      <div class="identity-window"><img src="assets/checkin-ia-identity.png" width="1559" height="1009" alt="Check-in IA: Consultoria em Gestão, Tecnologia e IA para Hotelaria e Hospedagem"></div>
      <div class="brand-rule" aria-hidden="true"></div>
      <p class="brand-mantra">Transformando a hospitalidade com estratégia e inteligência.</p>
    </header>

    <nav class="destinations" aria-label="Acessos da Check-in IA">
      <a class="destination destination--primary" href="https://wa.me/?text=Ol%C3%A1%2C%20quero%20falar%20diretamente%20com%20a%20Check-in%20IA." target="_blank" rel="noopener noreferrer">
        <span class="destination-copy"><span class="destination-title">Contato</span><span class="destination-detail">Converse com a Check-in IA pelo WhatsApp</span></span>
        <span class="destination-icon" aria-hidden="true"><svg viewBox="0 0 32 32" fill="currentColor"><path d="M16.02 3.2A12.73 12.73 0 0 0 5.08 22.5L3.4 28.8l6.44-1.66a12.73 12.73 0 1 0 6.18-23.94Zm0 23.27c-2.05 0-3.95-.6-5.56-1.64l-.4-.25-3.82.98 1.02-3.73-.27-.42a10.49 10.49 0 1 1 9.03 5.06Zm5.74-7.86c-.31-.16-1.86-.92-2.15-1.02-.29-.11-.5-.16-.71.16-.21.31-.81 1.02-.99 1.23-.18.21-.37.24-.68.08-.31-.16-1.32-.49-2.52-1.56-.93-.83-1.56-1.86-1.74-2.17-.18-.31-.02-.48.14-.64.14-.14.31-.37.47-.55.16-.18.21-.31.31-.52.1-.21.05-.39-.03-.55-.08-.16-.71-1.71-.97-2.34-.25-.61-.51-.53-.71-.54h-.6c-.21 0-.55.08-.84.39-.29.31-1.1 1.07-1.1 2.61s1.13 3.03 1.29 3.24c.16.21 2.22 3.39 5.38 4.75.75.32 1.34.52 1.8.66.76.24 1.45.21 2 .13.61-.09 1.86-.76 2.12-1.49.26-.73.26-1.36.18-1.49-.08-.13-.29-.21-.6-.37Z"/></svg></span>
      </a>
      <a class="destination" href="./index.html#topo">
        <span class="destination-copy"><span class="destination-title">Quem somos</span><span class="destination-detail">Conheça a Hospedagem 360</span></span>
        <span class="destination-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20"/><path d="M2 12h20"/></svg></span>
      </a>
      <a class="destination destination--partner" href="./parceiros.html">
        <span class="destination-copy"><span class="destination-title">Seja parceiro</span><span class="destination-detail">Conheça o programa de indicação</span></span>
        <span class="destination-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="20" height="12" x="2" y="6" rx="2"/><circle cx="12" cy="12" r="2"/><path d="M6 12h.01M18 12h.01"/></svg></span>
      </a>
    </nav>

    <figure class="hospitality-image">
      <img src="assets/checkin-ia-property.jpg" width="1600" height="896" alt="Fachada contemporânea de hospedagem em madeira e vidro ao entardecer">
    </figure>
  </main>
</body>
</html>
